name: ImmortalWrt-3 手动固件编译三方dockerman
# 仅手动触发，无自动编译规则
on:
  workflow_dispatch:
    inputs:
      TARGET_PROFILE:
        description: 编译机型名称（jdc_ax6600）
        required: true
        default: jdc_ax6600
      COMPILE_THREAD:
        description: 编译线程数
        required: true
        default: "4"
      SAVE_LOG:
        description: 是否保存完整编译日志
        type: boolean
        default: true

jobs:
  build_firmware:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. 拉取当前仓库全部文件
        uses: actions/checkout@v4

      - name: 2. 安装Ubuntu全套编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev gawk flex bison qemu-utils git wget unzip libssl-dev python3 python3-pip time rsync curl
          sudo apt autoremove -y
          sudo apt clean

      - name: 3. 克隆 ImmortalWrt 源码
        run: |
          git clone https://github.com/VIKINGYFY/immortalwrt.git openwrt
          cd openwrt
          git pull

      - name: 4. 覆盖自定义 feeds.conf.default
        run: cp -v ./immortalwrt/feeds.conf.default ./openwrt/feeds.conf.default

      - name: 5. 执行前置自定义脚本 diy-part1.sh
        run: |
          chmod +x ../immortalwrt/diy-part1.sh
          ../immortalwrt/diy-part1.sh
        working-directory: ./openwrt

      # 清理Rust环境与缓存
      - name: 清理Rust编译冲突环境与缓存
        run: |
          rustup self uninstall -y || true
          rm -rf ~/.rustup ~/.cargo
          cd openwrt
          rm -rf dl/cargo build_dir/target-aarch64_cortex-a53_musl/shadowsocks-rust*
          echo "Rust环境清理完成"

      # 替换第三方 Dockerman
      - name: 替换为第三方完整版 Dockerman
        run: |
          cd openwrt
          rm -rf feeds/luci/applications/luci-app-dockerman
          rm -rf feeds/luci/collections/luci-lib-docker
          rm -rf feeds/packages/utils/luci-lib-docker
          rm -rf package/luci-app-dockerman package/luci-lib-docker
          git clone --depth=1 https://github.com/lisaac/luci-lib-docker.git tmp-lib-docker
          git clone --depth=1 https://github.com/lisaac/luci-app-dockerman.git tmp-app-dockerman
          mv tmp-lib-docker/collections/luci-lib-docker package/luci-lib-docker
          mv tmp-app-dockerman/applications/luci-app-dockerman package/luci-app-dockerman
          rm -rf tmp-lib-docker tmp-app-dockerman
          sed -i 's/PKG_VERSION:=v/PKG_VERSION:=/g' package/luci-lib-docker/Makefile
          sed -i 's/PKG_VERSION:=v/PKG_VERSION:=/g' package/luci-app-dockerman/Makefile
          echo "第三方 Dockerman 替换完成"

      - name: 6. 更新并安装全部软件源 feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
        working-directory: ./openwrt

      # <<< 改动1：CPU双行脚本，working-directory 确保文件在 openwrt/files/ 下 >>>
      - name: 集成CPU温度/架构双行脚本
        working-directory: ./openwrt
        run: |
          mkdir -p files/sbin
          echo '#!/bin/sh' > files/sbin/cpuinfo
          echo 'grep -m1 "Processor" /proc/cpuinfo | sed "s/^Processor[[:space:]]*:[[:space:]]*//"' >> files/sbin/cpuinfo
          echo 'TEMP_PATH="/sys/class/thermal/thermal_zone0/temp"' >> files/sbin/cpuinfo
          echo 'if [ -r "$TEMP_PATH" ]; then' >> files/sbin/cpuinfo
          echo '    raw_temp=$(cat "$TEMP_PATH")' >> files/sbin/cpuinfo
          echo '    temp_int=$(( raw_temp / 1000 ))' >> files/sbin/cpuinfo
          echo '    temp_dec=$(( (raw_temp / 100) % 10 ))' >> files/sbin/cpuinfo
          echo '    cpu_temp="${temp_int}.${temp_dec}"' >> files/sbin/cpuinfo
          echo '    echo "CPU ${cpu_temp}°C"' >> files/sbin/cpuinfo
          echo 'else' >> files/sbin/cpuinfo
          echo '    echo "CPU 0.0°C"' >> files/sbin/cpuinfo
          echo 'fi' >> files/sbin/cpuinfo
          chmod +x files/sbin/cpuinfo

      - name: 7. 导入自定义编译配置 info.config
        run: cp -v ./immortalwrt/info.config ./openwrt/.config

      - name: 8. 执行后置自定义脚本 diy-part2.sh
        run: |
          chmod +x ../immortalwrt/diy-part2.sh
          ../immortalwrt/diy-part2.sh
          chmod 755 files/etc/hotplug.d/net/* 2>/dev/null || true
          chmod 755 files/etc/docker_poststart.sh 2>/dev/null || true
        working-directory: ./openwrt

      # <<< 改动2：defconfig 加上 FILES=files >>>
      - name: 9. 预编译生成完整配置
        run: make defconfig FILES=files
        working-directory: ./openwrt

      - name: 10. 下载编译依赖源码包
        run: make download -j${{ github.event.inputs.COMPILE_THREAD }}
        working-directory: ./openwrt

      # <<< 改动3：编译命令加上 FILES=files >>>
      - name: 11. 开始编译固件
        id: compile_task
        run: make -j1 V=s FILES=files 2>&1 | tee compile_log.txt
        working-directory: ./openwrt

      - name: 12. 打包编译日志
        if: ${{ github.event.inputs.SAVE_LOG == true || failure() }}
        run: tar -zcvf compile_log.tar.gz ./openwrt/compile_log.txt

      - name: 13. 上传编译日志产物
        if: ${{ github.event.inputs.SAVE_LOG == true || failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: 编译完整日志
          path: compile_log.tar.gz
          retention-days: 7

      - name: 固件目录校验
        if: success()
        run: ls -l openwrt/bin/targets/qualcommax/ipq60xx/

      - name: 14. 上传全新刷机factory固件
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt_JDC_AX6600_全新刷机_factory
          path: openwrt/bin/targets/qualcommax/ipq60xx/*factory.bin
          retention-days: 15

      - name: 15. 上传后台升级sysupgrade固件
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt_JDC_AX6600_在线升级_sysupgrade
          path: openwrt/bin/targets/qualcommax/ipq60xx/*sysupgrade.bin
          retention-days: 15
