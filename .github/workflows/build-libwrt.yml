# Description: Build OpenWrt using GitHub Actions
#
# updated version ref: https://github.com/dxdf/ActionsBuildOpenWRT
# 新增：Rust环境彻底清理，修复shadowsocks-rust编译报错
# 修正：全文件YAML缩进规范，消除解析错误
# 修复1：第三方Dockerman适配APK包格式，移除版本号v前缀
# 修复2：修正lisaac仓库目录结构，提取Makefile到包根目录
# 修复3：针对nas‑packages‑luci自动带入的md‑raid kmod，适配kernel6.18，屏蔽冲突内核模块
# 【新增】libwrt上游源码自动检测更新，无更新直接跳过编译
name: libwrt优化版带docker(自动检测上游更新)
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'   # UTC每6小时检查上游更新
env:
  REPO_URL: https://github.com/LiBwrt/LibWrt.git
  REPO_BRANCH: 25.12-nss
  FEEDS_CONF: libwrt/feeds.conf.default
  CONFIG_FILE: libwrt/info.config
  DIY_P1_SH: libwrt/diy-part1.sh
  DIY_P2_SH: libwrt/diy-part2.sh
  LAST_COMMIT_FILE: libwrt/.last_upstream_commit
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_COWTRANSFER: false
  UPLOAD_WETRANSFER: false
  UPLOAD_RELEASE: false
  TZ: Asia/Shanghai
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. 拉取当前仓库全部文件
        uses: actions/checkout@v4

      - name: 2. 获取LibWrt上游仓库最新Commit
        id: upstream_check
        run: |
          UPSTREAM_HEAD=$(git ls-remote "${REPO_URL}" "${REPO_BRANCH}" | awk '{print $1}')
          echo "upstream_commit=${UPSTREAM_HEAD}" >> $GITHUB_ENV
          echo "上游源码最新commit: ${UPSTREAM_HEAD}"

      - name: 3. 读取上一次编译记录的上游Commit
        id: read_last
        run: |
          if [ -f "${LAST_COMMIT_FILE}" ]; then
            LAST_BUILD_COMMIT=$(cat "${LAST_COMMIT_FILE}")
          else
            LAST_BUILD_COMMIT=""
          fi
          echo "last_commit=${LAST_BUILD_COMMIT}" >> $GITHUB_ENV
          echo "上次编译记录commit: ${LAST_BUILD_COMMIT}"

      - name: 4. 上游源码无更新，直接跳过编译全部任务
        if: env.upstream_commit == env.last_commit
        run: |
          echo "✅ 上游LibWrt源码没有发生更新，直接退出Job，不消耗CI时长"
          exit 0

      - name: 5. 安装Ubuntu全套编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev gawk flex bison qemu-utils git wget unzip libssl-dev python3 python3-pip time rsync curl
          sudo apt autoremove -y
          sudo apt clean

      - name: 6. 克隆源码
        working-directory: ./
        run: |
          git clone --depth=1 $REPO_URL -b $REPO_BRANCH openwrt

      - name: 7. 加载自定义软件源
        run: |
          [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
          chmod +x $DIY_P1_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P1_SH

      # 【核心修复】清理Rust环境与缓存，彻底规避shadowsocks-rust编译报错
      - name: 8. 清理Rust编译冲突环境与缓存
        run: |
          rustup self uninstall -y || true
          rm -rf ~/.rustup ~/.cargo
          cd openwrt
          rm -rf dl/cargo build_dir/target-aarch64_cortex-a53_musl/shadowsocks-rust*
          echo "Rust环境清理完成，已规避shadowsocks-rust编译错误"

      # 【关键修复】替换官方Dockerman + 修正目录结构 + APK版本号适配
      - name: 9. 替换为第三方完整版 Dockerman (修复目录结构+APK适配)
        run: |
          cd openwrt
          # 1. 彻底清理所有同名包，杜绝双版本冲突
          rm -rf feeds/luci/applications/luci-app-dockerman
          rm -rf feeds/luci/collections/luci-lib-docker
          rm -rf feeds/packages/utils/luci-lib-docker
          rm -rf package/luci-app-dockerman package/luci-lib-docker
          # 2. 克隆到临时目录
          git clone --depth=1 https://github.com/lisaac/luci-lib-docker.git tmp-lib-docker
          git clone --depth=1 https://github.com/lisaac/luci-app-dockerman.git tmp-app-dockerman
          # 3. 提取实际包目录到 package 根层级（Makefile 移到顶层，编译系统才能识别）
          mv tmp-lib-docker/collections/luci-lib-docker package/luci-lib-docker
          mv tmp-app-dockerman/applications/luci-app-dockerman package/luci-app-dockerman
          # 4. 清理临时目录
          rm -rf tmp-lib-docker tmp-app-dockerman
          # 5. 移除版本号v前缀，适配APK包格式强制校验
          sed -i 's/PKG_VERSION:=v/PKG_VERSION:=/g' package/luci-lib-docker/Makefile
          sed -i 's/PKG_VERSION:=v/PKG_VERSION:=/g' package/luci-app-dockerman/Makefile
          echo "第三方 Dockerman 替换完成，目录结构与APK格式已适配"

      - name: 10. 更新软件源
        run: cd openwrt && ./scripts/feeds update -a

      - name: 11. 安装软件源
        run: cd openwrt && ./scripts/feeds install -a

      - name: 12. 加载自定义配置
        run: |
          [ -e files ] && mv files openwrt/files
          [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
          chmod +x $DIY_P2_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P2_SH

      - name: 13. 下载软件包
        id: package
        run: |
          cd openwrt
          make defconfig
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: 14. 编译固件
        id: compile
        run: |
          cd openwrt
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT
          grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
          [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

      # ✅编译成功才写入本次上游commit记录，编译失败不更新，下次会重试编译
      - name: 15. 编译成功，记录本次上游commit到仓库
        if: steps.compile.outputs.status == 'success'
        run: |
          echo "${{ env.upstream_commit }}" > "${{ env.LAST_COMMIT_FILE }}"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ env.LAST_COMMIT_FILE }}"
          git commit -m "auto: 更新libwrt上次编译commit ${{ env.upstream_commit }}" || true
          git push || true

      - name: 16. 检查空间使用
        if: (!cancelled())
        run: df -hT

      - name: 17. 上传bin目录
        uses: actions/upload-artifact@main
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
        with:
          name: libwrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: openwrt/bin

      - name: 18. 整理文件
        id: organize
        if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 19. 上传固件目录
        uses: actions/upload-artifact@main
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          name: libwrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}

      - name: 20. 上传固件到CowTransfer
        id: cowtransfer
        if: steps.organize.outputs.status == 'success' && env.UPLOAD_COWTRANSFER == 'true' && !cancelled()
        run: |
          curl -fsSL git.io/file-transfer | sh
          ./transfer cow --block 2621440 -s -p 64 --no-progress ${FIRMWARE} 2>&1 | tee cowtransfer.log
          echo "::warning file=cowtransfer.com::$(cat cowtransfer.log | grep https)"
          echo "url=$(cat cowtransfer.log | grep https | cut -f3 -d" ")" >> $GITHUB_OUTPUT

      - name: 21. 上传固件到WeTransfer
        id: wetransfer
        if: steps.organize.outputs.status == 'success' && env.UPLOAD_WETRANSFER == 'true' && !cancelled()
        run: |
          curl -fsSL git.io/file-transfer | sh
          ./transfer wet -s -p 16 --no-progress ${FIRMWARE} 2>&1 | tee wetransfer.log
          echo "::warning file=wetransfer.com::$(cat wetransfer.log | grep https)"
          echo "url=$(cat wetransfer.log | grep https | cut -f3 -d" ")" >> $GITHUB_OUTPUT

      - name: 22. 生成发布标签
        id: tag
        if: env.UPLOAD_RELEASE == 'true' && !cancelled()
        run: |
          echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
          touch release.txt
          [ $UPLOAD_COWTRANSFER = true ] && echo "🔗 [Cowtransfer](${{ steps.cowtransfer.outputs.url }})" >> release.txt
          [ $UPLOAD_WETRANSFER = true ] && echo "🔗 [WeTransfer](${{ steps.wetransfer.outputs.url }})" >> release.txt
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 23. 上传固件到Releases
        uses: softprops/action-gh-release@v1
        if: steps.tag.outputs.status == 'success' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          files: ${{ env.FIRMWARE }}/*

      - name: 24. 删除旧的Workflow记录
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 1
          keep_minimum_runs: 3

      - name: 25. 删除旧版本Releases
        uses: dev-drprasad/delete-older-releases@v0.1.0
        if: env.UPLOAD_RELEASE == 'true' && !cancelled()
        with:
          keep_latest: 3
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
