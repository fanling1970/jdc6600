name: 自动编译 LibWrt 雅典娜AX6600
on:
  workflow_dispatch:    # 允许手动触发编译
  schedule:
    - cron: '0 */6 * * *'   # UTC时间每6小时检查上游源码更新

jobs:
  build_libwrt:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出个人配置仓库代码
        uses: actions/checkout@v4

      - name: 获取LibWrt上游仓库最新Commit
        id: upstream_check
        run: |
          UPSTREAM_URL="https://github.com/libwrt/libwrt.git"
          UPSTREAM_HEAD=$(git ls-remote "${UPSTREAM_URL}" HEAD | awk '{print $1}')
          echo "upstream_commit=${UPSTREAM_HEAD}" >> $GITHUB_ENV
          echo "LibWrt上游最新commit: ${UPSTREAM_HEAD}"

      - name: 读取上一次编译记录的上游Commit
        id: read_last
        run: |
          LAST_COMMIT_FILE="./libwrt/.last_upstream_commit"
          if [ -f "${LAST_COMMIT_FILE}" ]; then
            LAST_BUILD_COMMIT=$(cat "${LAST_COMMIT_FILE}")
          else
            LAST_BUILD_COMMIT=""
          fi
          echo "last_commit=${LAST_BUILD_COMMIT}" >> $GITHUB_ENV
          echo "上一次编译上游commit: ${LAST_BUILD_COMMIT}"

      - name: 上游无更新直接跳过编译任务
        if: env.upstream_commit == env.last_commit
        run: |
          echo "✅ 上游LibWrt源码没有更新，直接退出Job，不消耗CI时长"
          exit 0

      - name: 写入新上游Commit记录并提交仓库
        run: |
          LAST_COMMIT_FILE="./libwrt/.last_upstream_commit"
          echo "${{ env.upstream_commit }}" > "${LAST_COMMIT_FILE}"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "${LAST_COMMIT_FILE}"
          git commit -m "auto: 更新libwrt上次编译commit ${{ env.upstream_commit }}" || true
          git push || true

      - name: 安装固件编译依赖软件包
        run: |
          sudo apt update
          sudo apt install -y build-essential gcc g++ binutils bzip2 flex bison autoconf automake gettext libtool patch unzip curl wget git python3 python3-distutils libssl-dev ccache

      - name: 克隆LibWrt源码，切换到最新上游提交
        run: |
          git clone --depth=1 https://github.com/libwrt/libwrt.git openwrt
          cd openwrt
          git checkout ${{ env.upstream_commit }}

      - name: 复制libwrt子目录下自定义脚本与配置
        run: |
          cp -f ./libwrt/diy-part1.sh openwrt/
          cp -f ./libwrt/diy-part2.sh openwrt/
          cp -f ./libwrt/feeds.conf.default openwrt/
          cp -f ./libwrt/info.config openwrt/.config
          cd openwrt
          chmod +x diy-part1.sh diy-part2.sh
          ./diy-part1.sh

      - name: 替换为第三方完整版 Dockerman (修复目录结构+APK版本号适配)
        run: |
          cd openwrt
          # 1. 彻底清理所有同名包，杜绝双版本冲突
          rm -rf feeds/luci/applications/luci-app-dockerman
          rm -rf feeds/luci/collections/luci-lib-docker
          rm -rf feeds/packages/utils/luci-lib-docker
          rm -rf package/luci-app-dockerman package/luci-lib-docker
          # 2. 克隆到临时目录
          git clone --depth=1 https://github.com/lisaac/luci-lib-docker.git tmp-lib-docker
          git clone --depth=1 https://github.com/lisaac/luci-app-dockerman.git tmp-app-dockerman
          # 3. 提取实际包目录到 package 根层级（Makefile 移到顶层，编译系统才能识别）
          mv tmp-lib-docker/collections/luci-lib-docker package/luci-lib-docker
          mv tmp-app-dockerman/applications/luci-app-dockerman package/luci-app-dockerman
          # 4. 清理临时目录
          rm -rf tmp-lib-docker tmp-app-dockerman
          # 5. 移除版本号v前缀，适配APK包格式强制校验
          sed -i 's/PKG_VERSION:=v/PKG_VERSION:=/g' package/luci-lib-docker/Makefile
          sed -i 's/PKG_VERSION:=v/PKG_VERSION:=/g' package/luci-app-dockerman/Makefile
          echo "第三方 Dockerman 替换完成，目录结构与APK格式已适配"

      - name: 更新并安装feeds软件源
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 配置CCACHE编译缓存(最大10G开启压缩)
        uses: actions/cache@v4
        with:
          path: openwrt/.ccache
          key: ${{ runner.os }}-libwrt-ccache-ax6600
        env:
          CCACHE_MAXSIZE: 10G
          CCACHE_COMPRESS: true

      - name: 编译IPQ60xx雅典娜AX6600固件
        run: |
          cd openwrt
          ./diy-part2.sh
          make -j$(nproc) V=s

      - name: 上传编译完成固件产物
        uses: actions/upload-artifact@v4
        with:
          name: LibWrt‑AX6600‑IPQ60xx固件
          path: openwrt/bin/targets/ipq60xx/generic/*.bin
